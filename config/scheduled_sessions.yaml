scheduled_sessions:
  - id: iran-us-conflict-news
    schedule: "0 6 * * *"
    model: claude-opus-4-6
    seed_query: >
      Find the latest reliable news about the Iran-US conflict in the last 24 hours. Summarize the
      main developments, key actors, and any clear escalation or de-escalation
      signals with citations to the sources you used.
    allowed_tools:
      - web_search
      - web_fetch
      - polymarket_search_markets
      - polymarket_list_markets
      - polymarket_get_market
      - polymarket_get_price_history
